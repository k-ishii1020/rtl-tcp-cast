<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="title desc"><title id="title">Start a local RTL-TCP-CAST stream</title><desc id="desc">Select a local RTL-SDR, start streaming, and connect receiver applications to the RTL-TCP-CAST port.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3274aa"/></marker></defs><rect width="900" height="260" rx="20" fill="#f4f7fb"/><g font-family="system-ui,'Segoe UI',sans-serif" text-anchor="middle" fill="#20364b"><g fill="#fff" stroke="#94abc1" stroke-width="2"><rect x="40" y="82" width="220" height="100" rx="16"/><rect x="340" y="82" width="220" height="100" rx="16"/><rect x="640" y="42" width="220" height="80" rx="16"/><rect x="640" y="142" width="220" height="80" rx="16"/></g><text x="150" y="122" font-size="19" font-weight="700">Select RTL-SDR</text><text x="150" y="151" font-size="15">Choose the connected dongle</text><text x="450" y="122" font-size="19" font-weight="700">Start streaming</text><text x="450" y="151" font-size="15">Check the streaming status</text><text x="750" y="88" font-size="18" font-weight="700">Receiver app A</text><text x="750" y="188" font-size="18" font-weight="700">Receiver app B</text><g fill="none" stroke="#3274aa" stroke-width="4" marker-end="url(#a)"><path d="M260 132H330"/><path d="M560 122C600 122 600 82 630 82"/><path d="M560 142C600 142 600 182 630 182"/></g><text x="450" y="238" font-size="15" fill="#526679">Clients connect to RTL-TCP-CAST (default port 11234).</text></g></svg>
